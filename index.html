<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#faf8ef">
<title>2048</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #faf8ef;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 500px;
    margin-bottom: 12px;
  }

  .title {
    font-size: 2.4rem;
    font-weight: 800;
    color: #776e65;
  }

  .scores {
    display: flex;
    gap: 8px;
  }

  .score-box {
    background: #bbada0;
    border-radius: 6px;
    padding: 6px 14px;
    text-align: center;
    min-width: 70px;
  }

  .score-box .label {
    font-size: 0.65rem;
    font-weight: 700;
    color: #eee4da;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .score-box .value {
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
  }

  .controls {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 500px;
    margin-bottom: 12px;
  }

  .btn {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn:active { background: #776e65; }

  .board-container {
    position: relative;
    width: 100%;
    max-width: 500px;
    aspect-ratio: 1;
    background: #bbada0;
    border-radius: 8px;
    padding: 2%;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 2%;
    width: 100%;
    height: 100%;
  }

  .cell {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 6px;
  }

  .tile-layer {
    position: absolute;
    inset: 2%;
    pointer-events: none;
  }

  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-weight: 700;
    transition: top 0.12s ease, left 0.12s ease;
    will-change: top, left, transform;
  }

  .tile-new {
    animation: pop-in 0.2s ease;
  }

  .tile-merged {
    animation: pop-merge 0.2s ease;
  }

  @keyframes pop-in {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes pop-merge {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(238, 228, 218, 0.73);
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-msg {
    font-size: 2rem;
    font-weight: 800;
    color: #776e65;
    margin-bottom: 16px;
  }

  .overlay .btn { font-size: 1rem; padding: 12px 28px; }

  .instructions {
    max-width: 500px;
    width: 100%;
    text-align: center;
    margin-top: 12px;
    font-size: 0.8rem;
    color: #776e65;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="header">
  <div class="title">2048</div>
  <div class="scores">
    <div class="score-box">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="score-box">
      <div class="label">Best</div>
      <div class="value" id="best">0</div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn" id="new-game-btn">New Game</button>
  <button class="btn" id="undo-btn">Undo</button>
</div>

<div class="board-container">
  <div class="grid" id="grid"></div>
  <div class="tile-layer" id="tile-layer"></div>
  <div class="overlay" id="overlay">
    <div class="overlay-msg" id="overlay-msg">Game Over!</div>
    <button class="btn" id="overlay-btn">Try Again</button>
  </div>
</div>

<div class="instructions">Swipe or use arrow keys to move tiles</div>

<script>
(function() {
  'use strict';

  const SIZE = 4;
  const TILE_GAP_PCT = 2;
  const TILE_SIZE_PCT = (100 - TILE_GAP_PCT * (SIZE + 1)) / SIZE;

  const TILE_STYLES = {
    2:    { bg: '#eee4da', color: '#776e65', size: '2rem' },
    4:    { bg: '#ede0c8', color: '#776e65', size: '2rem' },
    8:    { bg: '#f2b179', color: '#f9f6f2', size: '2rem' },
    16:   { bg: '#f59563', color: '#f9f6f2', size: '1.8rem' },
    32:   { bg: '#f67c5f', color: '#f9f6f2', size: '1.8rem' },
    64:   { bg: '#f65e3b', color: '#f9f6f2', size: '1.8rem' },
    128:  { bg: '#edcf72', color: '#f9f6f2', size: '1.6rem' },
    256:  { bg: '#edcc61', color: '#f9f6f2', size: '1.6rem' },
    512:  { bg: '#edc850', color: '#f9f6f2', size: '1.6rem' },
    1024: { bg: '#edc53f', color: '#f9f6f2', size: '1.3rem' },
    2048: { bg: '#edc22e', color: '#f9f6f2', size: '1.3rem' },
  };

  const SUPER_STYLE = { bg: '#3c3a32', color: '#f9f6f2', size: '1.1rem' };

  // DOM refs
  const gridEl = document.getElementById('grid');
  const tileLayer = document.getElementById('tile-layer');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlay-msg');
  const overlayBtn = document.getElementById('overlay-btn');
  const newGameBtn = document.getElementById('new-game-btn');
  const undoBtn = document.getElementById('undo-btn');

  // State
  let grid, score, best, won, prevState, moving;

  function init() {
    // Build background grid cells
    gridEl.innerHTML = '';
    for (let i = 0; i < SIZE * SIZE; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      gridEl.appendChild(cell);
    }

    best = parseInt(localStorage.getItem('best2048') || '0', 10);
    bestEl.textContent = best;
    startNewGame();
  }

  function startNewGame() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    won = false;
    prevState = null;
    moving = false;
    overlay.classList.remove('active');
    addRandomTile();
    addRandomTile();
    render();
  }

  function savePrev() {
    prevState = {
      grid: grid.map(r => [...r]),
      score
    };
  }

  function undo() {
    if (!prevState) return;
    grid = prevState.grid;
    score = prevState.score;
    prevState = null;
    overlay.classList.remove('active');
    render();
  }

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) empty.push([r, c]);
    if (empty.length === 0) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    return [r, c];
  }

  function tilePos(index) {
    return TILE_GAP_PCT + index * (TILE_SIZE_PCT + TILE_GAP_PCT);
  }

  function render(newTiles, mergedTiles) {
    newTiles = newTiles || [];
    mergedTiles = mergedTiles || [];
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('best2048', best);
    }

    tileLayer.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const val = grid[r][c];
        if (val === 0) continue;
        const tile = document.createElement('div');
        tile.className = 'tile';
        const style = TILE_STYLES[val] || SUPER_STYLE;
        tile.style.background = style.bg;
        tile.style.color = style.color;
        tile.style.fontSize = style.size;
        tile.style.width = TILE_SIZE_PCT + '%';
        tile.style.height = TILE_SIZE_PCT + '%';
        tile.style.top = tilePos(r) + '%';
        tile.style.left = tilePos(c) + '%';
        tile.textContent = val;

        if (newTiles.some(t => t[0] === r && t[1] === c)) {
          tile.classList.add('tile-new');
        }
        if (mergedTiles.some(t => t[0] === r && t[1] === c)) {
          tile.classList.add('tile-merged');
        }
        tileLayer.appendChild(tile);
      }
    }
  }

  // Slide a single row left, returning { row, scoreDelta, merged, moved }
  function slideRow(row) {
    let arr = row.filter(v => v !== 0);
    let scoreDelta = 0;
    const mergedIdxs = [];
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        scoreDelta += arr[i];
        mergedIdxs.push(i);
        arr.splice(i + 1, 1);
      }
    }
    while (arr.length < SIZE) arr.push(0);
    const moved = row.some((v, i) => v !== arr[i]);
    return { row: arr, scoreDelta, mergedIdxs, moved };
  }

  function move(dir) {
    if (moving) return false;

    savePrev();

    let moved = false;
    let totalScore = 0;
    const mergedCells = [];

    // Normalize: rotate so we always slide left, then rotate back
    let g = grid.map(r => [...r]);

    // Transform grid so the move direction becomes "left"
    if (dir === 'right') g = g.map(r => [...r].reverse());
    else if (dir === 'up') g = transpose(g);
    else if (dir === 'down') g = transpose(g).map(r => [...r].reverse());

    for (let r = 0; r < SIZE; r++) {
      const result = slideRow(g[r]);
      if (result.moved) moved = true;
      totalScore += result.scoreDelta;
      g[r] = result.row;
      for (const idx of result.mergedIdxs) {
        // We need to track merged positions in original coordinates
        mergedCells.push([r, idx]);
      }
    }

    // Transform back
    if (dir === 'right') {
      g = g.map(r => [...r].reverse());
      mergedCells.forEach(m => m[1] = SIZE - 1 - m[1]);
    } else if (dir === 'up') {
      g = transpose(g);
      mergedCells.forEach(m => { const t = m[0]; m[0] = m[1]; m[1] = t; });
    } else if (dir === 'down') {
      g = g.map(r => [...r].reverse());
      g = transpose(g);
      mergedCells.forEach(m => { m[1] = SIZE - 1 - m[1]; const t = m[0]; m[0] = m[1]; m[1] = t; });
    }

    if (!moved) {
      prevState = null;
      return false;
    }

    grid = g;
    score += totalScore;

    moving = true;
    const newCell = addRandomTile();
    const newTiles = newCell ? [newCell] : [];
    render(newTiles, mergedCells);

    setTimeout(() => {
      moving = false;
      if (!won && hasValue(2048)) {
        won = true;
        showOverlay('You Win!', 'Keep Going');
      } else if (isGameOver()) {
        showOverlay('Game Over!', 'Try Again');
      }
    }, 150);

    return true;
  }

  function transpose(g) {
    return g[0].map((_, c) => g.map(r => r[c]));
  }

  function hasValue(val) {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === val) return true;
    return false;
  }

  function isGameOver() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) return false;
        if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return false;
        if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return false;
      }
    return true;
  }

  function showOverlay(msg, btnText) {
    overlayMsg.textContent = msg;
    overlayBtn.textContent = btnText;
    overlay.classList.add('active');
  }

  // --- Input Handling ---

  // Keyboard
  document.addEventListener('keydown', function(e) {
    const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
    if (map[e.key]) {
      e.preventDefault();
      move(map[e.key]);
    }
  });

  // Touch (swipe)
  let touchStartX, touchStartY, touchStartTime;
  const MIN_SWIPE = 30;
  const MAX_SWIPE_TIME = 500;

  document.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartTime = Date.now();
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    if (touchStartX === undefined) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dt = Date.now() - touchStartTime;
    touchStartX = undefined;

    if (dt > MAX_SWIPE_TIME) return;

    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);
    if (Math.max(absDx, absDy) < MIN_SWIPE) return;

    if (absDx > absDy) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  // Buttons
  newGameBtn.addEventListener('click', startNewGame);
  overlayBtn.addEventListener('click', function() {
    if (won) {
      overlay.classList.remove('active');
    } else {
      startNewGame();
    }
  });
  undoBtn.addEventListener('click', undo);

  // Prevent pull-to-refresh / overscroll on mobile
  document.addEventListener('touchmove', function(e) {
    e.preventDefault();
  }, { passive: false });

  init();
})();
</script>
</body>
</html>
